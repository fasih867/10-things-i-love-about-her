<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7c6dc" />
  <title>10 Things About You</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <span class="brand">for you.</span>
      <span class="counter" id="counter">INTRO</span>
    </header>

    <section class="deck" id="deck" aria-live="polite"></section>

    <footer class="controls">
      <button class="nav-btn" id="prev" aria-label="Previous card">←</button>
      <div class="dots" id="dots"></div>
      <button class="nav-btn next" id="next" aria-label="Next card">→</button>
    </footer>

    <p class="hint" id="hint">tap card to reveal</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
